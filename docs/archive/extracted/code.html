<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_6 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_6" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_6');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js DNA double helix with rich multi-colored particle distribution & high density
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 0, 52);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
container.appendChild(renderer.domElement);

const mainGroup = new THREE.Group();
scene.add(mainGroup);

// Soft particle circle canvas texture generator
function createParticleTexture() {
  const c = document.createElement('canvas');
  c.width = 64;
  c.height = 64;
  const ctx = c.getContext('2d');
  const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
  gradient.addColorStop(0.25, 'rgba(255, 255, 255, 0.9)');
  gradient.addColorStop(0.6, 'rgba(255, 255, 255, 0.35)');
  gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(32, 32, 32, 0, Math.PI * 2);
  ctx.fill();
  return new THREE.CanvasTexture(c);
}

const particleTexture = createParticleTexture();

// Dense DNA parameters with multiple multi-chromatic base pairs
const basePairs = 180; // High particle count
const helixRadius = 10.5;
const heightSpan = 140; // Taller to cover full scrollable journey
const turns = 6.2;

const strand1Positions = [];
const strand2Positions = [];
const strand1Colors = [];
const strand2Colors = [];

// Color Palette spectrum: Sage, Emerald, Cyan/Azure, Deep Slate, Soft Coral / Amber highlight
const cSage = new THREE.Color(0xa3c9a8);
const cCyan = new THREE.Color(0x38bdf8);
const cEmerald = new THREE.Color(0x34d399);
const cIndigo = new THREE.Color(0x6366f1);
const cAmber = new THREE.Color(0xfbbf24);
const cRose = new THREE.Color(0xf43f5e);
const cSlate = new THREE.Color(0x334155);

const rungsGroup = new THREE.Group();
mainGroup.add(rungsGroup);

for (let i = 0; i < basePairs; i++) {
  const t = i / basePairs;
  const angle = t * Math.PI * 2 * turns;
  const y = (t - 0.5) * heightSpan;

  // Strand 1 position with slight organic micro-jitter
  const x1 = Math.cos(angle) * helixRadius + (Math.sin(i * 0.7) * 0.25);
  const z1 = Math.sin(angle) * helixRadius + (Math.cos(i * 0.7) * 0.25);

  // Strand 2 (opposite 180 deg)
  const x2 = Math.cos(angle + Math.PI) * helixRadius + (Math.sin(i * 0.9) * 0.25);
  const z2 = Math.sin(angle + Math.PI) * helixRadius + (Math.cos(i * 0.9) * 0.25);

  // Sub-particles per base node for dense clustered molecular clouds
  for (let s = 0; s < 4; s++) {
    const spread = 0.55;
    strand1Positions.push(
      x1 + (Math.random() - 0.5) * spread,
      y + (Math.random() - 0.5) * spread,
      z1 + (Math.random() - 0.5) * spread
    );

    // Dynamic color gradient across height & alternation
    let col1 = new THREE.Color();
    if (i % 4 === 0) col1.lerpColors(cSage, cCyan, Math.sin(t * Math.PI * 2) * 0.5 + 0.5);
    else if (i % 4 === 1) col1.lerpColors(cEmerald, cIndigo, t);
    else if (i % 4 === 2) col1.lerpColors(cCyan, cSage, Math.cos(t * Math.PI) * 0.5 + 0.5);
    else col1.lerpColors(cAmber, cEmerald, t);

    strand1Colors.push(col1.r, col1.g, col1.b);
  }

  for (let s = 0; s < 4; s++) {
    const spread = 0.55;
    strand2Positions.push(
      x2 + (Math.random() - 0.5) * spread,
      y + (Math.random() - 0.5) * spread,
      z2 + (Math.random() - 0.5) * spread
    );

    let col2 = new THREE.Color();
    if (i % 4 === 0) col2.lerpColors(cIndigo, cRose, Math.sin(t * Math.PI * 3) * 0.5 + 0.5);
    else if (i % 4 === 1) col2.lerpColors(cSlate, cCyan, t);
    else if (i % 4 === 2) col2.lerpColors(cRose, cSage, Math.sin(t * Math.PI));
    else col2.lerpColors(cCyan, cIndigo, t);

    strand2Colors.push(col2.r, col2.g, col2.b);
  }

  // Intermediate base-pair rungs with molecular connecting beads
  if (i % 2 === 0) {
    const rungBeads = 8;
    const rungGeo = new THREE.BufferGeometry();
    const rPositions = [];
    const rColors = [];

    const rungColorA = (i % 4 === 0) ? cAmber : cCyan;
    const rungColorB = (i % 4 === 0) ? cEmerald : cIndigo;

    for (let k = 0; k <= rungBeads; k++) {
      const frac = k / rungBeads;
      rPositions.push(
        x1 + (x2 - x1) * frac,
        y,
        z1 + (z2 - z1) * frac
      );
      const mixed = rungColorA.clone().lerp(rungColorB, frac);
      rColors.push(mixed.r, mixed.g, mixed.b);
    }
    rungGeo.setAttribute('position', new THREE.Float32BufferAttribute(rPositions, 3));
    rungGeo.setAttribute('color', new THREE.Float32BufferAttribute(rColors, 3));

    const rungMat = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.45,
      linewidth: 1
    });
    const line = new THREE.Line(rungGeo, rungMat);
    rungsGroup.add(line);
  }
}

// Geometry 1
const geo1 = new THREE.BufferGeometry();
geo1.setAttribute('position', new THREE.Float32BufferAttribute(strand1Positions, 3));
geo1.setAttribute('color', new THREE.Float32BufferAttribute(strand1Colors, 3));
const mat1 = new THREE.PointsMaterial({
  size: 2.1,
  map: particleTexture,
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  depthWrite: false,
  blending: THREE.NormalBlending
});
const points1 = new THREE.Points(geo1, mat1);
mainGroup.add(points1);

// Geometry 2
const geo2 = new THREE.BufferGeometry();
geo2.setAttribute('position', new THREE.Float32BufferAttribute(strand2Positions, 3));
geo2.setAttribute('color', new THREE.Float32BufferAttribute(strand2Colors, 3));
const mat2 = new THREE.PointsMaterial({
  size: 2.1,
  map: particleTexture,
  vertexColors: true,
  transparent: true,
  opacity: 0.92,
  depthWrite: false,
  blending: THREE.NormalBlending
});
const points2 = new THREE.Points(geo2, mat2);
mainGroup.add(points2);

// Surrounding floating kinase & peptide cloud (350+ multi-colored floating particles)
const cloudCount = 380;
const cloudGeo = new THREE.BufferGeometry();
const cloudPos = [];
const cloudColors = [];
const palette = [cSage, cCyan, cEmerald, cIndigo, cAmber, cRose];

for (let m = 0; m < cloudCount; m++) {
  cloudPos.push(
    (Math.random() - 0.5) * 80,
    (Math.random() - 0.5) * 150,
    (Math.random() - 0.5) * 55
  );
  const picked = palette[Math.floor(Math.random() * palette.length)];
  cloudColors.push(picked.r, picked.g, picked.b);
}
cloudGeo.setAttribute('position', new THREE.Float32BufferAttribute(cloudPos, 3));
cloudGeo.setAttribute('color', new THREE.Float32BufferAttribute(cloudColors, 3));

const cloudMat = new THREE.PointsMaterial({
  size: 1.4,
  map: particleTexture,
  vertexColors: true,
  transparent: true,
  opacity: 0.55,
  depthWrite: false
});
const cloudPoints = new THREE.Points(cloudGeo, cloudMat);
scene.add(cloudPoints);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
scene.add(ambientLight);

// Group positioning
mainGroup.rotation.z = 0.18;
mainGroup.position.x = 0;

let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;
let scrollProgress = 0;

window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX - window.innerWidth / 2) * 0.0003;
  mouseY = (e.clientY - window.innerHeight / 2) * 0.0003;
});

window.addEventListener('scroll', () => {
  const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
  if (maxScroll > 0) {
    scrollProgress = window.scrollY / maxScroll;
  }
});

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  // Continuous rotation influenced by scroll
  mainGroup.rotation.y = elapsedTime * 0.22 + scrollProgress * Math.PI * 2.5;
  mainGroup.position.y = - (scrollProgress - 0.5) * 35;

  cloudPoints.rotation.y = elapsedTime * 0.035;
  cloudPoints.rotation.x = Math.sin(elapsedTime * 0.05) * 0.08;

  targetX += (mouseX - targetX) * 0.05;
  targetY += (mouseY - targetY) * 0.05;

  mainGroup.rotation.x = targetY * 0.7;
  mainGroup.rotation.z = 0.18 + targetX * 0.4;

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_6 -->
</body>
</html>
