<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" fill="none" width="900" height="160">
  <defs>
    <linearGradient id="ptx-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="78%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="x-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0ea5e9" flood-opacity="0.18"/>
    </filter>
  </defs>

  <style>
    .title-main {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 88px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .title-sub {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      fill: #0d9488;
    }
  </style>

  <!-- High-end clean typography with scientific accentuation -->
  <g filter="url(#soft-glow)">
    <text x="450" y="96" text-anchor="middle" class="title-main">
      <tspan fill="url(#ptx-title-grad)">PhyloTarget</tspan><tspan fill="url(#x-grad)">X</tspan>
    </text>
  </g>

  <!-- Subtitle badge bar underneath -->
  <text x="450" y="138" text-anchor="middle" class="title-sub">Computational Oncology &amp; Target Kinase Discovery</text>
</svg>
