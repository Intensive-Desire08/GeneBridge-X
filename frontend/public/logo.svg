<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="ptx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C3E50"/>
      <stop offset="60%" stop-color="#5A7D9A"/>
      <stop offset="100%" stop-color="#A3C9A8"/>
    </linearGradient>
    <linearGradient id="ptx-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3C9A8"/>
      <stop offset="100%" stop-color="#8EB893"/>
    </linearGradient>
  </defs>
  <!-- Modern minimalist phylogenetic / helix cross mark -->
  <circle cx="24" cy="24" r="22" stroke="url(#ptx-grad)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
  <!-- Target crosshairs delicate -->
  <line x1="24" y1="6" x2="24" y2="12" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="36" x2="24" y2="42" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="24" x2="12" y2="24" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="24" x2="42" y2="24" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Intertwining target nodes -->
  <path d="M16 31C16 23 32 25 32 17" stroke="url(#ptx-grad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 31C32 23 16 25 16 17" stroke="#A3C9A8" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
  <circle cx="16" cy="17" r="3" fill="#2C3E50"/>
  <circle cx="32" cy="17" r="3.5" fill="url(#ptx-node)"/>
  <circle cx="16" cy="31" r="3.5" fill="url(#ptx-node)"/>
  <circle cx="32" cy="31" r="3" fill="#2C3E50"/>
  <circle cx="24" cy="24" r="2.5" fill="#A3C9A8"/>
</svg>