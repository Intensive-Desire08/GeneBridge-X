<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" fill="none">
  <defs>
    <!-- Solid high contrast gradients for maximum visibility against translucent white/light backgrounds -->
    <linearGradient id="main-text-fill" x1="0%" y1="0%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="x-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="strong-legibility-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 116px;
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .brand-sub {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      fill: #047857;
    }
    .accent-dot {
      fill: #10b981;
    }
  </style>

  <!-- High-contrast brand title text with crisp definition -->
  <g filter="url(#strong-legibility-shadow)">
    <text x="600" y="132" text-anchor="middle" class="brand-title">
      <tspan fill="url(#main-text-fill)">PhyloTarget</tspan><tspan fill="url(#x-gradient)">X</tspan>
    </text>
  </g>

  <!-- Subtitle badge bar -->
  <g>
    <circle cx="210" cy="186" r="3.5" class="accent-dot" />
    <text x="600" y="193" text-anchor="middle" class="brand-sub">COMPUTATIONAL ONCOLOGY &amp; TARGET KINASE DISCOVERY</text>
    <circle cx="990" cy="186" r="3.5" class="accent-dot" />
  </g>
</svg>